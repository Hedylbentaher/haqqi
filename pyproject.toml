[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haqqi"
version = "1.0.0"
description = "Assistant trilingue (AR/FR/EN) du droit du travail tunisien : RAG hybride, LangGraph, MCP"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "langchain-core>=1.0",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.3",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.9,<2",
    "langchain-mcp-adapters>=0.1,<0.4",
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]